<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Pelanggan - __CUSTOMER_PORTAL_TITLE__</title>
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/public/customer.css?v=20261013-1">
  <script defer src="/public/customer-login.js?v=20260819-1"></script>
  <script defer src="/vendor/alpine.min.js"></script>
</head>
<body>
  <main class="portal-login" x-data="customerLoginApp()">
    <section class="portal-login-card">
      <div class="portal-login-mark"><i class="fa-solid fa-wifi"></i></div>
      <p class="portal-kicker"><i class="fa-solid fa-user"></i> Login Pelanggan</p>
      <h1>Masuk ke portal pelanggan</h1>
      <p class="portal-login-company">__CUSTOMER_PORTAL_TITLE__</p>
      <p class="portal-login-lead">Lihat tagihan, status layanan, dan akun hotspot Anda dengan mudah.</p>

      <form @submit.prevent="submit()">
        <label for="customer-username">Username</label>
        <div class="portal-input">
          <i class="fa-solid fa-user"></i>
          <input id="customer-username" x-model="form.username" autocomplete="username" placeholder="Masukkan username" required autofocus>
        </div>

        <label for="customer-password">Password</label>
        <div class="portal-input">
          <i class="fa-solid fa-lock"></i>
          <input id="customer-password" x-model="form.password" :type="showPassword ? 'text' : 'password'" autocomplete="current-password" placeholder="Masukkan password" required>
          <button type="button" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Sembunyikan password' : 'Tampilkan password'">
            <i class="fa-solid" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>

        <p class="portal-form-error" role="alert" aria-live="polite" x-text="error"></p>
        <button type="submit" class="portal-primary-button" :disabled="submitting">
          <span x-show="!submitting"><i class="fa-solid fa-right-to-bracket"></i> Masuk ke Akun Saya</span>
          <span x-cloak x-show="submitting"><i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...</span>
        </button>
      </form>

      <div class="portal-account-note"><i class="fa-solid fa-circle-info"></i><span>Gunakan akun pelanggan yang diberikan admin. Akun ini berbeda dari akun hotspot.</span></div>
    </section>
  </main>
</body>
</html>
