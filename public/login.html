<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - __DASHBOARD_TITLE__</title>
  <link rel="stylesheet" href="/public/tailwind.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/public/styles.css?v=20261013-1">
  <script defer src="/public/login.js?v=20261013-1"></script>
  <script defer src="/vendor/alpine.min.js"></script>
</head>
<body class="font-body">
  <main class="login-page" x-data="loginApp()">
    <section class="login-shell">
      <div class="login-intro">
        <div class="login-brand">
          <span class="brand-icon"><i class="fa-solid fa-bell"></i></span>
          <span class="login-brand-copy"><strong>Reminder Bot</strong><small>Operasional pelanggan</small></span>
        </div>
        <div class="login-welcome">
          <span class="login-eyebrow"><i class="fa-solid fa-shield-halved"></i> Akses administrator</span>
          <h1>Masuk sebagai admin</h1>
          <p>Kelola pelanggan, tagihan, jadwal pengingat, dan layanan jaringan dari satu tempat.</p>
        </div>
      </div>
      <div class="login-card">
        <form @submit.prevent="submit()">
          <label>
            <span>Username administrator</span>
            <div class="login-input">
              <i class="fa-solid fa-user"></i>
              <input x-model="form.username" autocomplete="username" placeholder="Masukkan username administrator" required autofocus>
            </div>
          </label>
          <label>
            <span>Password administrator</span>
            <div class="login-input">
              <i class="fa-solid fa-lock"></i>
              <input x-model="form.password" :type="showPassword ? 'text' : 'password'" autocomplete="current-password" placeholder="Masukkan password" required>
              <button type="button" class="login-password-toggle" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Sembunyikan password' : 'Tampilkan password'">
                <i class="fa-regular" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </label>
          <div class="login-error" role="alert" aria-live="polite" x-text="error"></div>
          <button type="submit" class="login-submit" :disabled="submitting">
            <span x-show="!submitting"><i class="fa-solid fa-right-to-bracket mr-2"></i>Masuk ke Dashboard</span>
            <span x-cloak x-show="submitting"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Memproses...</span>
          </button>
        </form>
        <div class="login-role-note"><i class="fa-solid fa-circle-info"></i><span>Gunakan akun administrator untuk mengakses pengaturan dan data seluruh pelanggan.</span></div>
        <p class="login-footnote"><a href="/pelanggan/login"><i class="fa-solid fa-users"></i> Login sebagai pelanggan</a></p>
      </div>
    </section>
  </main>

</body>
</html>
