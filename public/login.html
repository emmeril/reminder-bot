<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - __DASHBOARD_TITLE__</title>
  <link rel="stylesheet" href="/public/tailwind.css">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/public/styles.css?v=20260818-1">
  <script defer src="/public/login.js"></script>
  <script defer src="/vendor/alpine.min.js"></script>
</head>
<body class="font-body">
  <main class="login-page" x-data="loginApp()">
    <section class="login-shell">
      <div class="login-intro">
        <div class="login-brand">
          <span class="brand-icon"><i class="fa-solid fa-bell"></i></span>
          <span class="login-brand-copy"><strong>Reminder Bot</strong><small>Customer operations</small></span>
        </div>
        <div class="login-welcome">
          <span class="login-eyebrow"><i class="fa-solid fa-shield-halved"></i> Administrator area</span>
          <h1>Selamat datang kembali</h1>
          <p>Masuk untuk mengelola pelanggan, pembayaran, reminder, dan aktivitas layanan.</p>
        </div>
      </div>
      <div class="login-card">
        <form @submit.prevent="submit()">
          <label>
            <span>Username</span>
            <div class="login-input">
              <i class="fa-solid fa-user"></i>
              <input x-model="form.username" autocomplete="username" placeholder="Masukkan username" required autofocus>
            </div>
          </label>
          <label>
            <span>Password</span>
            <div class="login-input">
              <i class="fa-solid fa-lock"></i>
              <input x-model="form.password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
            </div>
          </label>
          <div class="login-error" x-text="error"></div>
          <button class="login-submit" :disabled="submitting">
            <span x-show="!submitting"><i class="fa-solid fa-right-to-bracket mr-2"></i>Masuk ke Dashboard</span>
            <span x-cloak x-show="submitting"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Memproses...</span>
          </button>
        </form>
      </div>
    </section>
  </main>

</body>
</html>
